services:
  syslog:
    build: .
    image: ghcr.io/todd2982/syslog:latest
    container_name: syslog
    restart: unless-stopped
    ports:
      # Host 514 -> container 5514 (rsyslog runs as a non-root user).
      - "514:5514/udp"
      - "514:5514/tcp"
      # TLS (see README) - uncomment after enabling it in config/rsyslog.conf.
      # - "6514:6514/tcp"
    environment:
      TZ: America/Chicago
      RETENTION_DAYS: "30"
      COMPRESS_AFTER_DAYS: "1"
      # User and group that rsyslog runs as and that own the log files.
      PUID: "10514"
      PGID: "10514"
    volumes:
      - syslog-data:/var/log/remote
      # Or keep logs in a host folder (created and handed to PUID:PGID at start):
      # - /srv/syslog:/var/log/remote
      # - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /var/lib/rsyslog:uid=10514,gid=10514,mode=0750
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Only used at startup to hand the log folder to PUID:PGID and drop root.
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  syslog-data:
