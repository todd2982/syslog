# rsyslog configuration for a containerized remote-log receiver.
# Runs as an unprivileged user, so it listens on 5514 inside the container.

global(
  workDirectory="/var/lib/rsyslog"
  maxMessageSize="64k"
  preserveFQDN="on"
)

# ---- Inputs -----------------------------------------------------------------
module(load="imudp")
module(load="imtcp" maxSessions="1000")

input(type="imudp" port="5514")
input(type="imtcp" port="5514")

# ---- Optional: TLS on 6514 (RFC 5425) ----------------------------------------
# 1. Add "rsyslog-tls" to the apk install line in the Dockerfile.
# 2. Mount your CA, cert and key at /certs and publish 6514:6514/tcp.
# 3. Uncomment the block below.
#
# global(
#   defaultNetstreamDriver="gtls"
#   defaultNetstreamDriverCAFile="/certs/ca.pem"
#   defaultNetstreamDriverCertFile="/certs/cert.pem"
#   defaultNetstreamDriverKeyFile="/certs/key.pem"
# )
# module(load="imtcp" streamDriver.name="gtls" streamDriver.mode="1"
#        streamDriver.authMode="anon")
# input(type="imtcp" port="6514")

# ---- Output: one directory per sending host, one file per day -------------------
# securepath="replace" stops a sender from using "/" or ".." in its hostname to
# write outside /var/log/remote.
template(name="PerHostDailyFile" type="list") {
  constant(value="/var/log/remote/")
  property(name="hostname" securepath="replace" caseConversion="lower")
  constant(value="/")
  property(name="timegenerated" dateFormat="year")
  constant(value="-")
  property(name="timegenerated" dateFormat="month")
  constant(value="-")
  property(name="timegenerated" dateFormat="day")
  constant(value=".log")
}

# RFC 3339 timestamps, with the sender's hostname and the original message.
template(name="LineFormat" type="string"
         string="%timegenerated:::date-rfc3339% %hostname% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# Remote messages go to per-host files. closeTimeout closes idle files after
# 10 minutes so the pruning job can safely compress yesterday's files.
if $inputname == "imudp" or $inputname == "imtcp" then {
  action(type="omfile"
         dynaFile="PerHostDailyFile"
         template="LineFormat"
         dynaFileCacheSize="200"
         closeTimeout="10"
         createDirs="on"
         dirCreateMode="0754"
         fileCreateMode="0644")
  stop
}

# rsyslog's own internal messages go to the container log.
action(type="omfile" file="/dev/stdout" template="LineFormat")
